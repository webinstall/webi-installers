name: Node.js CI
on:
  push:
    branches: ['main']
  pull_request:
jobs:
  build:
    name: "Fmt, Lint, & Test"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: "Webi: Install 'shfmt' and 'shellcheck', and update PATH"
        run: |
          sh ./_scripts/install-ci-deps
          echo "${HOME}/.local/bin" >> $GITHUB_PATH
          echo "${HOME}/.local/opt/pwsh" >> $GITHUB_PATH
      - run: |
          git submodule init
          git submodule update
      - run: shfmt --version
      - run: shellcheck -V
      - run: node --version
      - run: npm run fmt
      - run: npm ci
      - run: npm run lint
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: "Test pwsh install in a minimal container"
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          go run ./cmd/webicached --once --shallow pwsh
          node _webi/test.js ./pwsh/
          wget -O /tmp/curl https://github.com/moparisthebest/static-curl/releases/download/v8.5.0/curl-amd64
          chmod a+rx /tmp/curl
          # bare image: no curl, no CA certs, no libicu (needed by pwsh)
          docker run --rm \
            -e DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1 \
            -v /tmp/curl:/usr/bin/curl:ro \
            -v /etc/ssl/certs:/etc/ssl/certs:ro \
            -v "$PWD/install-pwsh.sh:/tmp/install-pwsh.sh:ro" \
            debian:stable-slim sh /tmp/install-pwsh.sh
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run test
